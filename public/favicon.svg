<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4B400"/>
      <stop offset="1" stop-color="#FFD54F"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#g)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- tower crane mark -->
  <g fill="#111827">
    <!-- mast -->
    <rect x="29" y="11" width="4.4" height="39" rx="2"/>
    <!-- footing -->
    <rect x="23.5" y="47.5" width="15.5" height="4.4" rx="2"/>
    <!-- jib -->
    <rect x="11.5" y="15" width="40.5" height="4.4" rx="2"/>
    <!-- counterweight -->
    <rect x="11.5" y="19.6" width="7.5" height="6.4" rx="1.4"/>
    <!-- hoist line -->
    <rect x="42.6" y="19.6" width="2.1" height="13.5" rx="1"/>
  </g>
  <!-- hook -->
  <circle cx="43.65" cy="35.6" r="2.7" fill="none" stroke="#111827" stroke-width="2"/>
</svg>
